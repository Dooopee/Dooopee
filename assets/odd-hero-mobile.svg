<svg xmlns="http://www.w3.org/2000/svg" width="680" height="710" viewBox="0 0 680 710" role="img" aria-labelledby="t d">
<title id="t">ODD PRACTIC — CS2 training hub</title>
<desc id="d">Mobile edition of the monochrome ODD PRACTIC profile banner, with an animated geometric logo, moving scan line and title.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#9DA0A7" stroke-opacity=".09" fill="none"/></pattern><linearGradient id="beam"><stop stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".1"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient><clipPath id="frame"><rect x="1" y="1" width="678" height="708" rx="18"/></clipPath></defs>
<style>
text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,'Liberation Mono',monospace}
@keyframes enter{from{opacity:.25;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(640px)}}
@keyframes trace{to{stroke-dashoffset:-100}}
@keyframes pulse{0%,100%{opacity:.2}50%{opacity:.85}}
.copy{animation:enter 1s ease-out both}.mark{animation:drift 7s ease-in-out infinite}.scan{animation:slide 9s ease-in-out infinite alternate}.trace{animation:trace 10s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.copy,.mark,.scan,.trace,.pulse{animation:none!important}}
</style>
<rect width="680" height="710" rx="19" fill="#090A0D"/>
<g clip-path="url(#frame)">
<rect width="680" height="710" fill="url(#grid)"/><rect x="1" y="1" width="678" height="708" rx="18" fill="none" stroke="#36383F" stroke-width="2"/>
<g class="copy">
<rect x="40" y="32" width="8" height="8" rx="1" fill="#F5F5F5"/><text x="60" y="42" fill="#B8BBC2" font-size="17" class="mono" letter-spacing="1">DOOOPEE / CURRENT BUILD</text>
<path d="M40 72H640" stroke="#353941"/>
<text x="36" y="197" fill="#FAFAFB" font-size="127" font-weight="800" letter-spacing="-6">ODD</text>
<text x="38" y="307" fill="#FAFAFB" font-size="108" font-weight="800" letter-spacing="-6">PRACTIC</text>
<text x="42" y="359" fill="#BFC1C8" font-size="23" letter-spacing="2.1">CS2 / TRAINING HUB</text>
</g>
<path d="M0 394H680M0 671H680" stroke="#373B43"/>
<g class="scan"><rect x="-30" y="395" width="68" height="276" fill="url(#beam)"/></g>
<g stroke="#8D9199" stroke-opacity=".45" fill="none"><path d="M128 460L344 422L551 460V604L344 642L128 604Z"/><path d="M160 619L513 434" stroke-opacity=".22"/></g>
<path class="trace" d="M128 460L344 422L551 460V604L344 642L128 604Z" fill="none" stroke="#F7F7F7" stroke-opacity=".5" stroke-dasharray="20 25 3 52"/>
<g transform="translate(175 395) scale(.33)" fill="#F6F6F7"><g class="mark">
<path d="M244 317L512 154L781 317L713 386L512 264L307 389Z"/>
<path d="M244 708L512 870L781 708L714 638L512 758L309 636Z"/>
<path d="M366 518L510 412L657 518L510 625Z"/>
</g></g>
<circle class="pulse" cx="538" cy="470" r="4" fill="#FFFFFF"/>
<text x="40" y="694" font-size="14" fill="#B5B8BF" class="mono">PRIVATE DEVELOPMENT</text>
<text x="640" y="694" font-size="14" text-anchor="end" fill="#8E939D" class="mono">ODD / 01</text>
</g>
</svg>