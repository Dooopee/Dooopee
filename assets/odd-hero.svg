<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d">
<title id="t">ODD PRACTIC — CS2 training hub</title>
<desc id="d">Monochrome developer-style motion graphic with the ODD PRACTIC title, geometric identity, moving scan beam, tracking lines and development status. Motion is decorative and can be disabled.</desc>
<defs>
<linearGradient id="beam"><stop stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".085"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<linearGradient id="fade"><stop stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".8"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8D929B" stroke-opacity=".085"/></pattern>
<clipPath id="frame"><rect x="1" y="1" width="1198" height="428" rx="18"/></clipPath>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif}
.mono{font-family:Consolas,'Liberation Mono',monospace}
@keyframes entrance{from{opacity:.2;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes sweep{from{transform:translateX(-25px)}to{transform:translateX(440px)}}
@keyframes stream{to{stroke-dashoffset:-140}}
@keyframes oscillate{0%,100%{opacity:.22}50%{opacity:.75}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes draw{from{stroke-dashoffset:210}to{stroke-dashoffset:0}}
.intro{animation:entrance 1.1s cubic-bezier(.2,.8,.2,1) both}
.beam{animation:sweep 8s ease-in-out infinite alternate}
.stream{animation:stream 13s linear infinite}
.pulse{animation:oscillate 5s ease-in-out infinite}
.float{animation:drift 7s ease-in-out infinite}
.draw{stroke-dasharray:210;animation:draw 2s ease-out both}
@media(prefers-reduced-motion:reduce){.intro,.beam,.stream,.pulse,.float,.draw{animation:none!important}}
</style>
<rect width="1200" height="430" rx="19" fill="#090A0D"/>
<g clip-path="url(#frame)">
 <rect x="1" y="1" width="1198" height="428" fill="url(#grid)"/>
 <rect x="1" y="1" width="1198" height="428" rx="18" fill="none" stroke="#34373D" stroke-width="2"/>
 <path d="M690 0V430M690 64H1200M690 365H1200" fill="none" stroke="#3D4047" stroke-opacity=".85"/>
 <path d="M42 64H654M42 365H654" stroke="#35383E"/>
 <g class="beam"><rect x="705" y="66" width="80" height="298" fill="url(#beam)"/></g>
 <g fill="none" stroke="#7C818A" stroke-width="1">
  <path d="M730 122L852 80H1050L1168 144V293L1050 349H858L730 301Z" opacity=".45"/>
  <path d="M745 285L1115 92" stroke-opacity=".17"/>
  <path d="M728 174H1166M943 80V350" stroke-opacity=".17"/>
  <path d="M789 100l-24 24m364 173 23-23M789 319l-24-24m364-164 23 22" stroke-opacity=".55"/>
 </g>
 <g class="stream" fill="none" stroke="#F3F3F4" stroke-width="1.5" stroke-dasharray="30 24 6 80" opacity=".45">
  <path d="M730 122L852 80H1050L1168 144V293L1050 349H858L730 301Z"/>
 </g>
 <g transform="translate(796 68) scale(.295)"><g class="float">
  <g fill="#F6F6F7">
    <path d="M244 317L512 154L781 317L713 386L512 264L307 389Z"/>
    <path d="M244 708L512 870L781 708L714 638L512 758L309 636Z"/>
    <path d="M366 518L510 412L657 518L510 625Z"/>
  </g>
 </g></g>
 <path class="draw" d="M753 344H864" stroke="url(#fade)" stroke-width="2" fill="none"/>
 <circle class="pulse" cx="1081" cy="103" r="4" fill="#FFFFFF"/>
 <circle class="pulse" cx="790" cy="291" r="3" fill="#FFFFFF"/>
 <g class="intro">
  <rect x="44" y="28" width="7" height="7" rx="1" fill="#F5F5F5"/>
  <text x="64" y="35" fill="#B4B6BC" font-size="13" class="mono" letter-spacing="1.8">DOOOPEE / CURRENT BUILD</text>
  <text x="646" y="35" fill="#8F949C" text-anchor="end" font-size="12" class="mono">README.MD</text>
  <text x="38" y="181" fill="#F7F7F8" font-size="120" font-weight="800" letter-spacing="-6">ODD</text>
  <text x="38" y="285" fill="#F7F7F8" font-size="107" font-weight="800" letter-spacing="-6">PRACTIC</text>
  <text x="44" y="336" fill="#C4C7CD" font-size="20" letter-spacing="2.3">CS2 / TRAINING HUB</text>
  <text x="44" y="397" fill="#A3A7AE" font-size="13" class="mono">PRIVATE DEVELOPMENT</text>
  <text x="647" y="397" fill="#858A92" text-anchor="end" font-size="13" class="mono">01 — 04 / PRACTICE LOOP</text>
 </g>
 <text x="737" y="39" fill="#B9BBC2" font-size="12" class="mono" letter-spacing="1.3">EXPERIMENT / TRAIN / REPEAT</text>
 <text x="1158" y="396" fill="#9CA0A6" text-anchor="end" font-size="12" class="mono">ODD / IDENTITY SYSTEM</text>
</g>
</svg>