<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
<title id="title">ODD PRACTIC — session loop</title>
<desc id="desc">Compact monochrome developer-style diagram. Four planned steps: select, practice, review and repeat. Animated signal line connects the steps.</desc>
<defs><linearGradient id="trace"><stop stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".85"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient><clipPath id="cut"><rect x="1" y="1" width="1198" height="268" rx="17"/></clipPath></defs>
<style>
text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,'Liberation Mono',monospace}
@keyframes shift{to{stroke-dashoffset:-92}}
@keyframes breathe{0%,100%{opacity:.38}50%{opacity:1}}
@keyframes enter{from{opacity:.25;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.line{animation:shift 6s linear infinite}.dot{animation:breathe 3.8s ease-in-out infinite}.copy{animation:enter 1s ease-out both}
@media(prefers-reduced-motion:reduce){.line,.dot,.copy{animation:none!important}}
</style>
<rect width="1200" height="270" rx="18" fill="#0C0D10"/><g clip-path="url(#cut)">
<rect x="1" y="1" width="1198" height="268" rx="17" fill="none" stroke="#373A40" stroke-width="2"/>
<path d="M41 63H1159M41 232H1159" stroke="#343740"/>
<g class="copy">
<text x="42" y="42" fill="#C1C4CA" font-size="13" letter-spacing="1.5" class="mono">SESSION / FLOW MODEL</text>
<text x="1158" y="42" text-anchor="end" fill="#8F949C" font-size="13" class="mono">CONCEPT / NOT RELEASED</text>
</g>
<path d="M86 141H1114" stroke="#43464F" stroke-width="2"/>
<path class="line" d="M86 141H1114" stroke="url(#trace)" stroke-width="3" stroke-dasharray="28 34 3 27" fill="none"/>
<g fill="#0C0D10" stroke="#EFF0F2" stroke-width="2">
<circle cx="98" cy="141" r="12"/><circle cx="428" cy="141" r="12"/><circle cx="758" cy="141" r="12"/><circle cx="1088" cy="141" r="12"/>
</g>
<g fill="#FFFFFF"><circle class="dot" cx="98" cy="141" r="4"/><circle class="dot" cx="428" cy="141" r="4"/><circle class="dot" cx="758" cy="141" r="4"/><circle class="dot" cx="1088" cy="141" r="4"/></g>
<g fill="#A6AAB2" font-size="13" class="mono"><text x="72" y="100">01 / SELECT</text><text x="402" y="100">02 / PRACTICE</text><text x="732" y="100">03 / REVIEW</text><text x="1060" y="100">04 / REPEAT</text></g>
<g fill="#F5F6F7" font-size="23" font-weight="700"><text x="72" y="197">Выбор</text><text x="402" y="197">Тренировка</text><text x="732" y="197">Разбор</text><text x="1060" y="197">Повтор</text></g>
<g fill="#90949C" font-size="13" class="mono"><text x="42" y="254">AIM  /  MOVEMENT  /  RECOIL</text><text x="1158" y="254" text-anchor="end">ODD PRACTIC</text></g>
</g></svg>